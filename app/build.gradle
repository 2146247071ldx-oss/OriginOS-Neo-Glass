plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoglass.originos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neoglass.originos'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0.0-api102'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // libxposed API 102：只参与编译，不打包进 APK
    compileOnly 'io.github.libxposed:api:102.0.0'
}