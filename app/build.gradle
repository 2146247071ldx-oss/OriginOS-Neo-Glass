plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoglass.originos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neoglass.originos'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0.0-api102'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 编译时使用，不会打包进 APK
    compileOnly 'io.github.libxposed:api:102.0.0'
    
    // 必须加上这行：用于 App 界面与 LSPosed 框架通信，查询激活状态
    implementation 'io.github.libxposed:service:102.0.0'
}