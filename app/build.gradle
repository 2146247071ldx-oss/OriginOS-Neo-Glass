plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoglass.originos'
    compileSdk 37
    buildToolsVersion "37.0.0"

    defaultConfig {
        applicationId 'com.neoglass.originos'
        minSdk 29
        targetSdk 36
        versionCode 2
        versionName '2.0.0-api102'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 编译期 Hook 接口，不可打包
    compileOnly 'io.github.libxposed:api:102.0.0'
    // 恢复服务通信，用于查询激活状态
    implementation 'io.github.libxposed:service:102.0.0'
}