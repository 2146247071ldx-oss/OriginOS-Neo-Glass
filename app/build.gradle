
plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoglass.originos'
    compileSdk 35

    defaultConfig {
        applicationId 'com.neoglass.originos'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '2.0.0-api102'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // 现代 Xposed API 102：仅编译时使用
    compileOnly 'io.github.libxposed:api:102.0.0'

    // 框架与模块应用之间的通信接口
    implementation 'io.github.libxposed:service:102.0.0'
}
