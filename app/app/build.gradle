plugins {
    id 'com.android.application'
}

android {
    namespace 'com.neoglass.originos'
    compileSdk 35

    defaultConfig {
        applicationId "com.neoglass.originos"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // LSPosed / Xposed API：只参与编译，不打包进 APK
    compileOnly 'de.robv.android.xposed:api:82'
}